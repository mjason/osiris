[package]
name = "osiris"
version = "0.3.39"
edition = "2024"
rust-version = "1.94"
authors = ["MJ <tywf91@gmail.com>"]
description = "The osr Lisp compiler"
readme = "README.md"
license = "MIT"
homepage = "https://github.com/mjason/osiris"
repository = "https://github.com/mjason/osiris"
publish = false

[[bin]]
name = "osr"
path = "src/main.rs"

[dependencies]
nom = "8.0"
notify = "8.2"
rayon = "1.10"
oxilangtag = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ruff_python_formatter = "=0.0.4"
ruff_python_ast = "=0.0.4"
ruff_python_parser = "=0.0.4"
ruff_text_size = "=0.0.4"
toml = "0.8"
toml_edit = "0.22"
unicode-normalization = "0.1"
unicode-width = "0.2"
json5 = "0.4"
globset = "0.4"
# Ruff 0.0.4 expects the 0.9 compact_str integration retained by 0.10.1.
get-size2 = "=0.10.1"
async-graphql = { version = "=7.0.16", default-features = false }
async-graphql-derive = "=7.0.16"
async-graphql-parser = "=7.0.16"
async-graphql-value = "=7.0.16"
futures = "0.3"
libsql = { version = "=0.9.29", default-features = false, features = ["core"] }

[build-dependencies]
futures = "0.3"
json5 = "0.4"
libsql = { version = "=0.9.29", default-features = false, features = ["core"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# The Ruff toolchain bump should not force unrelated source-style rewrites.
collapsible_if = "allow"
manual_is_multiple_of = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
